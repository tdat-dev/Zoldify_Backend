# Cụm chạy Zoldify Backend trên một VPS.
#
#   cp .env.sample .env      rồi điền, ít nhất DB_PASSWORD và hai khoá JWT
#   docker compose up -d --build
#   docker compose logs -f api
#
# Năm dịch vụ, chạy theo đúng thứ tự này và không có cách nào chạy sai thứ tự:
#   mysql + redis  →  migrate (chạy một lần rồi thoát)  →  api + worker
#
# CÓ Redis từ Epic 4. Trước đây cố tình KHÔNG thêm vì cache là
# `CacheModule.register()` in-process — thêm Redis lúc không có code nói chuyện
# với nó chỉ tạo container chạy không và một sơ đồ nói dối. Nay app.module.ts đọc
# REDIS_URL (env-bridge) và cache catalog products đi qua nó (single-flight +
# fail-open); @keyv/redis đã nằm trong dependencies nên image có sẵn client. Vì
# vậy Redis giờ là thật, không còn là container trang trí.
#
# Cộng thêm `backup`: chỉ chờ mysql healthy rồi chạy song song, api không phụ
# thuộc vào nó (sao lưu hỏng không được làm sập ứng dụng).
#
# KHÔNG đặt `name:` ở đây — tên project truyền lúc chạy bằng cờ `-p`
# (prod: `-p zoldify`, staging: `-p zoldify-staging`) để CÙNG một file compose
# này chạy được cả hai môi trường; khác biệt cổng/URL nằm ở .env mỗi bên.

# Giới hạn log cho MỌI service. Driver json-file mặc định của Docker không có
# trần: log của api cứ thế phình ra tới khi đầy ổ đĩa VPS. 5 file x 10 MB là
# đủ đọc lại vài ngày gần nhất bằng `docker compose logs`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    logging: *default-logging
    environment:
      # `:?` làm compose DỪNG kèm thông báo khi biến trống, thay vì dựng một
      # database có mật khẩu rỗng rồi để đó.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD đang trống — điền vào .env trước khi chạy}
      MYSQL_DATABASE: ${DB_DATABASE:-zoldify}
    command:
      # utf8mb4 để tên sản phẩm tiếng Việt và emoji không thành dấu hỏi.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # `migrate` chờ cái này. Thiếu healthcheck thì migration chạy lúc MySQL
      # mới bật cổng nhưng chưa nhận kết nối, và nó hỏng ngẫu nhiên — lần được
      # lần không, tuỳ máy nhanh chậm.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Mở cổng ra máy chủ chỉ khi cần soi bằng công cụ ngoài. Để đóng thì chỉ có
    # container trong cùng mạng nói chuyện được với database.
    # ports:
    #   - '3306:3306'

  # Redis chỉ làm CACHE (Epic 4). Dữ liệu cache là bỏ đi được: mất thì cache
  # fail-open đọc lại từ MySQL. Nên tắt cả hai kiểu ghi đĩa (--save '' +
  # --appendonly no) để Redis chạy thuần RAM, không cần volume, không lo mất dữ
  # liệu khi tạo lại container.
  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    # Không mở cổng ra máy chủ: chỉ container trong mạng compose gọi được.
    # ports:
    #   - '6379:6379'

  # Sao lưu database mỗi ngày vào ./backups trên VPS (xem scripts/backup-db.sh).
  #
  # Trước 29/09 không có bản sao lưu nào: toàn bộ đơn, tiền, sổ cái nằm trong
  # một volume trên một máy. Chạy một bản ngay khi service khởi động (tức mỗi
  # lần deploy), sau đó 24 giờ một lần; giữ 14 ngày.
  #
  # ./backups VẪN nằm trên cùng VPS: chống được xoá nhầm, migration hỏng, dữ
  # liệu bị ghi sai; KHÔNG chống được mất cả máy. Service `offsite` bên dưới
  # chép nó ra R2. Cách khôi phục: DEPLOY.md, mục "Sao lưu và khôi phục".
  backup:
    image: mysql:8
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD đang trống, điền vào .env trước khi chạy}
      DB_DATABASE: ${DB_DATABASE:-zoldify}
      DB_HOST: mysql
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    # Thay entrypoint của ảnh mysql: không khởi động một MySQL thứ hai, chỉ
    # mượn mysqldump/gzip có sẵn trong ảnh.
    entrypoint: ['sh', '/backup-db.sh']
    volumes:
      - ./scripts/backup-db.sh:/backup-db.sh:ro
      - ./backups:/backups
    logging: *default-logging

  # Chép ./backups lên Cloudflare R2 mỗi 6 giờ, giữ 30 ngày trên R2 (xem
  # scripts/offsite-backup.sh). Không phụ thuộc mysql hay api: nó chỉ đọc thư
  # mục, và hỏng thì chỉ log lỗi, không kéo gì khác xuống.
  #
  # Token R2 RIÊNG (BACKUP_R2_*), không dùng R2_ACCESS_KEY_ID của ứng dụng: token
  # đó chỉ vào được bucket ảnh, và tách riêng thì lỗ hổng ở api không chạm được
  # bản sao lưu. Thiếu biến thì service nằm chờ và báo trong log, không làm hỏng
  # lần deploy.
  offsite:
    image: rclone/rclone:1
    restart: unless-stopped
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-zoldify-backups}
      BACKUP_R2_PREFIX: ${BACKUP_R2_PREFIX:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    entrypoint: ['sh', '/offsite-backup.sh']
    volumes:
      - ./scripts/offsite-backup.sh:/offsite-backup.sh:ro
      # Chỉ đọc: service này không bao giờ được sửa hay xoá bản local.
      - ./backups:/backups:ro
    logging: *default-logging

  # Chạy migration NHƯ MỘT BƯỚC RIÊNG, không nhét vào lúc api khởi động.
  #
  # Nếu để api tự chạy migration lúc boot: dựng hai bản api là hai tiến trình
  # cùng đổi lược đồ một lúc, và migration hỏng thì api vào vòng khởi động lại
  # vô tận, mỗi vòng thử migrate lại một lần. Ở đây hỏng là dừng hẳn, `api`
  # không bao giờ khởi động, và log nằm nguyên một chỗ để đọc.
  migrate:
    build:
      context: .
      target: runtime
    image: zoldify-backend:latest
    restart: 'no'
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: root
    command:
      - node
      - ./node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/data-source.js

  api:
    build:
      context: .
      target: runtime
    image: zoldify-backend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Ghi đè năm biến này SAU env_file. Trong .env chúng trỏ vào 127.0.0.1 cho
      # lúc chạy trên máy cá nhân; trong mạng của compose, `127.0.0.1` là chính
      # container api chứ không phải MySQL/Redis.
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: root
      PORT: '3000'
      # Trỏ cache vào service `redis` trong mạng nội bộ. Trong .env dev biến này
      # để trống (in-memory); ở đây bật Redis thật cho cụm nhiều-instance.
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      # ĐÂY LÀ DÒNG QUYẾT ĐỊNH ẢNH SẢN PHẨM CÓ SỐNG QUA LẦN DEPLOY SAU KHÔNG.
      #
      # Ảnh người bán tải lên đi vào `public/images/{folder_type}` trên đĩa —
      # không có R2, không có S3, xem multer.config.ts. Không có dòng này thì
      # chúng nằm trong lớp ghi của container, và `docker compose up` với ảnh
      # mới tạo container mới: toàn bộ ảnh hàng của mọi người bán biến mất.
      #
      # Volume có TÊN chứ không phải bind mount, nên lần tạo đầu Docker chép
      # nội dung sẵn có trong ảnh vào volume — 26 tấm ảnh danh mục đang được
      # git theo dõi vẫn còn.
      - product-images:/app/public/images
      # Khoá Firebase Admin để verify token đăng nhập Google. File này KHÔNG vào
      # git (là secret, đã gitignore) — mỗi máy deploy tự đặt vào gốc repo và
      # chown cho UID 1000 (user `node` trong ảnh). Thiếu file thì
      # POST /api/auth/firebase trả 401 "Firebase chưa được cấu hình".
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

  # Tiến trình chạy job nền — task #14.
  #
  # VÌ SAO PHẢI LÀ MỘT CONTAINER RIÊNG, KHÔNG PHẢI MỘT LUỒNG TRONG `api`.
  #
  # Hai job của TasksService đụng tiền: một cái hoàn ký quỹ cho người mua, một
  # cái giải ngân cho người bán. Trước đây chúng hẹn giờ bằng @nestjs/schedule,
  # tức bộ đếm giờ nằm trong chính tiến trình api. Hôm nay compose dựng đúng
  # một bản api nên chưa sao. Nhưng cả Epic 4 (cache Redis) lẫn task #5 (socket
  # và throttler qua Redis) tồn tại chính là để chạy được NHIỀU bản api — và
  # đúng ngày ai đó nâng số bản lên thì mỗi bản mang theo một bộ đếm giờ, tới
  # giờ cả ba cùng huỷ một đơn. Không request nào lỗi, chỉ có sổ tiền lệch.
  #
  # Nay lịch nằm trong Redis, api không còn bộ đếm giờ nào, và job chỉ được
  # giao cho MỘT worker. Nâng `api` lên bao nhiêu bản cũng không đổi điều đó.
  #
  # Ngược lại: KHÔNG nâng số bản của chính `worker` lên khi chưa đọc lại
  # scripts/selfcheck-worker.ts. BullMQ giao mỗi job cho đúng một worker nên
  # nhiều worker vẫn an toàn về số lần chạy; nhưng `OrdersService.cancelExpired`
  # đọc đơn NGOÀI transaction và không khoá dòng, nên hai lượt quét chồng lên
  # nhau vẫn có cửa hoàn tiền hai lần. Một worker là đủ cho hai job mỗi giờ.
  worker:
    build:
      context: .
      target: runtime
    # CÙNG image với api: một lần build, hai lệnh chạy. Build ảnh thứ hai là mở
    # đường cho api và worker chạy lệch phiên bản mã.
    image: zoldify-backend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USERNAME: root
      REDIS_URL: redis://redis:6379
    command: ['node', 'dist/worker']
    # TẮT healthcheck thừa hưởng từ Dockerfile.
    #
    # Dockerfile khai HEALTHCHECK gọi fetch vào PORT — đúng cho api, vô nghĩa ở
    # đây vì worker không mở cổng nào. Để nguyên thì container này `unhealthy`
    # vĩnh viễn, và mọi thứ đọc trạng thái đó đều đọc sai.
    #
    # Chưa thay bằng healthcheck thật vì "worker khoẻ" nghĩa là "job vẫn tới
    # giờ là chạy" — muốn kiểm thì phải hỏi Redis xem lượt chạy gần nhất cách
    # đây bao lâu. Đó là việc của giám sát, ghi vào phần nợ của báo cáo #14.
    healthcheck:
      disable: true
    # KHÔNG mount product-images: worker không đụng ảnh. Mount thừa một volume
    # ghi được là mở thêm một đường cho tiến trình nền sửa dữ liệu người dùng.
    #
    # Có mount khoá Firebase (chỉ đọc): job huỷ đơn / chốt vận đơn tạo thông
    # báo, và NotificationsService gửi push FCM qua khoá này. Thiếu file thì
    # FirebaseService chỉ cảnh báo và bỏ push, worker vẫn chạy.
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

volumes:
  mysql-data:
  product-images:
