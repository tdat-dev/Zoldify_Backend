name: Deploy Backend

# CD kiểu "pull rồi build trên VPS": gate lint+build xanh mới SSH vào VPS,
# git reset --hard về đúng nhánh, rồi scripts/deploy/lan-luot-api.sh build và
# thay lần lượt từng bản api để API không trả 502 trong lúc deploy.
#   - nhánh chore/soat-cau-hinh-payos-firebase  -> PRODUCTION (api.zoldify.com)
#   - nhánh staging                             -> STAGING   (api-staging.zoldify.com)
# Secrets cần: VPS_HOST, VPS_USER, VPS_SSH_KEY (đã set sẵn trong repo).

on:
  push:
    branches:
      - chore/soat-cau-hinh-payos-firebase
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # build (nest/tsc) là cổng CHẶN thật — code không biên dịch được thì không deploy.
      - run: npm run build
      # lint chỉ cảnh báo: codebase còn nhiều nợ lint cũ, chặn ở đây là chặn mọi deploy.
      - run: npm run lint --if-present
        continue-on-error: true

  deploy:
    name: Deploy to VPS
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Mặc định 10 phút. Migration trên bảng 1 triệu dòng có thể lâu hơn, job bị
          # ngắt giữa chừng thì API mới không được bật (xem scripts/selfcheck-ci.ts).
          command_timeout: 30m
          script: |
            set -e
            REF='${{ github.ref_name }}'
            if [ "$REF" = "staging" ]; then
              DIR=/opt/staging/zoldify-backend; PROJ=zoldify-staging
            else
              DIR=/opt/zoldify-backend; PROJ=zoldify
            fi
            cd "$DIR"
            git fetch origin "$REF"
            git checkout -B "$REF" "origin/$REF"
            # Thay lần lượt từng bản api thay vì `up -d --build` tạo lại cả ba
            # cùng lúc (502 khoảng 5 giây mỗi lần deploy). Xem đầu script.
            bash scripts/deploy/lan-luot-api.sh "$PROJ"
            docker image prune -f || true
            # Giữ 4 GB cache mới nhất: build vẫn nhanh, không phụ thuộc Docker Hub,
            # mà cache không phình tới đầy đĩa VPS 40 GB (xem scripts/selfcheck-ci.ts).
            docker builder prune -a -f --keep-storage 4GB || true
            echo "Deployed $REF to $DIR (project $PROJ)"
